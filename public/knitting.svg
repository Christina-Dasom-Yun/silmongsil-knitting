<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="95" fill="none"/>
    
    <g transform="translate(10, 10) scale(0.9)">
        <defs>
            <linearGradient id="heartYarnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#ffcdd2;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#ef9a9a;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#e57373;stop-opacity:1" />
            </linearGradient>
        </defs>
        <path d="M100,180 C20,100 20,40 60,20 C80,10 95,20 100,40 C105,20 120,10 140,20 C180,40 180,100 100,180 Z"
              fill="url(#heartYarnGrad)" stroke="#ef9a9a" stroke-width="2"/>
        
        <g fill="none" stroke="#ffebee" stroke-width="3" stroke-linecap="round" opacity="0.7">
            <path d="M60,30 C50,50 40,80 60,110 M140,30 C150,50 160,80 140,110 M80,130 C90,150 110,150 120,130 M50,70 C70,60 130,60 150,70"/>
        </g>
    </g>

    <g>
        <defs>
            <linearGradient id="needleWoodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#d7ccc8;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#a1887f;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#8d6e63;stop-opacity:1" />
            </linearGradient>
        </defs>

        <g transform="translate(40, 40) rotate(45)">
            <rect x="0" y="0" width="160" height="10" rx="5" ry="5" fill="url(#needleWoodGrad)" stroke="#6d4c41" stroke-width="1.5"/>
            <circle cx="-5" cy="5" r="8" fill="url(#needleWoodGrad)" stroke="#6d4c41" stroke-width="1.5"/>
            <path d="M160,5 L170,5" stroke="#6d4c41" stroke-width="1.5" stroke-linecap="round"/> </g>

        <g transform="translate(160, 40) rotate(135)">
            <rect x="0" y="0" width="160" height="10" rx="5" ry="5" fill="url(#needleWoodGrad)" stroke="#6d4c41" stroke-width="1.5"/>
            <circle cx="-5" cy="5" r="8" fill="url(#needleWoodGrad)" stroke="#6d4c41" stroke-width="1.5"/>
            <path d="M160,5 L170,5" stroke="#6d4c41" stroke-width="1.5" stroke-linecap="round"/> </g>
    </g>
</svg>